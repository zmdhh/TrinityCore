name: Build Win Tools
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3.3.5
      - name: Download Boost
        shell: cmd
        run: |
          curl -L -o C:\boost.7z https://github.com/TrinityCore/TrinityCore/releases/download/TDB1200.26021/boost_1_91_0-msvc-14.3-64.exe
          C:\boost.7z /SILENT /SUPPRESSMSGBOXES /DIR="C:\Boost"
      - name: Configure
        run: cmake -S . -B build -DTOOLS=1 -DWITHOUT_METRICS=1 -DBOOST_ROOT="C:\Boost" -DBOOST_LIBRARYDIR="C:\Boost\lib64-msvc-14.3"
      - name: Build Tools
        run: cmake --build build --config Release --target mapextractor --target mmaps_generator --target vmap4extractor --target vmap4assembler
      - uses: actions/upload-artifact@v4
        with:
          name: tools-335
          path: build/bin/Release/mapextractor.exe