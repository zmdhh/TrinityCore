name: Build Win Tools
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { ref: 3.3.5 }
      - name: Install Boost
        run: choco install boost-msvc-14.3 -y --no-progress
      - name: Configure
        run: cmake -S . -B build -DTOOLS=1 -DWITHOUT_METRICS=1
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: tools-335
          path: build/bin/Release/*.exe