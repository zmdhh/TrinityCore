name: Build Win Tools
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3.3.5
          submodules: true
      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.83.0
          link: static
          platform_version: 2022
          toolset: msvc
      - name: Install OpenSSL
        run: |
          $exe = "$env:TEMP\OpenSSL.exe"
          (New-Object Net.WebClient).DownloadFile('https://slproweb.com/download/Win64OpenSSL-3_4_1.exe', $exe)
          Start-Process $exe -Wait -ArgumentList '/SILENT','/SP-','/SUPPRESSMSGBOXES',"/DIR=C:\OpenSSL-Win64"
          echo "OPENSSL_ROOT_DIR=C:\OpenSSL-Win64" >> $env:GITHUB_ENV
      - name: Configure
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: cmake -GNinja -S . -B build -DTOOLS=ON -DWITHOUT_METRICS=1 -DBoost_COMPILER=-vc143 -DBoost_ARCHITECTURE=-x64 -DOPENSSL_ROOT_DIR=C:\OpenSSL-Win64
      - name: Build Tools
        run: cmake --build build --config Release --target mapextractor --target mmaps_generator --target vmap4extractor --target vmap4assembler
      - uses: actions/upload-artifact@v4
        with:
          name: tools-335
          path: build/**/*.exe
          if-no-files-found: error