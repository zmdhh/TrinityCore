name: Build Win Tools
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { ref: 3.3.5 }
      - name: Install Boost
        run: |
          nuget install boost -Version 1.83.0 -ExcludeVersion -OutputDirectory C:\local
          echo "BOOST_ROOT=C:\local\boost" >> 
      - name: Configure
        run: cmake -S . -B build -DTOOLS=1 -DWITHOUT_METRICS=1 -DBOOST_ROOT=""
      - name: Build Tools Only
        run: cmake --build build --config Release --target mapextractor --target mmaps_generator --target vmap4extractor --target vmap4assembler
      - uses: actions/upload-artifact@v4
        with:
          name: tools-335
          path: build/bin/Release/*.exe