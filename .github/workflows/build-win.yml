name: Build Win Tools
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3.3.5
      - name: Install Boost
        shell: cmd
        run: |
          nuget install boost -Version 1.83.0 -ExcludeVersion -OutputDirectory C:\local
      - name: Configure
        run: cmake -S . -B build -DTOOLS=1 -DWITHOUT_METRICS=1 -DBOOST_ROOT="C:\local\boost"
      - name: Build Tools
        run: cmake --build build --config Release --target mapextractor --target mmaps_generator --target vmap4extractor --target vmap4assembler
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tools-335
          path: build/bin/Release/mapextractor.exe
          if-no-files-found: error