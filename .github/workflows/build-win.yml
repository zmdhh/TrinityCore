name: Build Win Tools
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { ref: 3.3.5 }
      - name: Install Boost (vcpkg)
        run: |
          vcpkg install boost --triplet x64-windows
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> 
      - name: Build
        run: cmake --workflow --fresh --preset ci 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: tools-335
          path: build/bin/Release/*.exe